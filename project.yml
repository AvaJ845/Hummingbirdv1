name: Hummingbird
options:
  bundleIdPrefix: com.hummingbird
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.4.2"
    CURRENT_PROJECT_VERSION: "7"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "3L683975L8"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_PREVIEWS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ALWAYS_SEARCH_USER_PATHS: NO
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ENABLE_TESTABILITY: YES
      GCC_PREPROCESSOR_DEFINITIONS: "DEBUG=1 $(inherited)"
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      ENABLE_TESTABILITY: NO
targets:
  Hummingbird:
    type: application
    platform: iOS
    sources:
      - path: Hummingbird
        excludes:
          - "**/.DS_Store"
          - "**/*.storekit"
          - "**/*.entitlements"
          - "Resources/Legal/**"
      - path: Hummingbird/Resources/Legal
        buildPhase: resources
        type: folder
    dependencies:
      - target: HummingbirdWidget
        embed: true
    settings:
      base:
        PRODUCT_NAME: Hummingbird
        PRODUCT_BUNDLE_IDENTIFIER: com.hummingbird.app
        CODE_SIGN_ENTITLEMENTS: Hummingbird/Hummingbird.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: Hummingbird
        INFOPLIST_KEY_NSHumanReadableCopyright: "Educational projections — not financial advice."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Hummingbird uses the microphone so you can dictate a stock ticker or crypto id for an educational projection."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Hummingbird converts speech into a ticker or coin id to run an educational price projection — not financial advice."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
  HummingbirdWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: HummingbirdWidget
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
      - path: Hummingbird/Support/AppGroup.swift
      - path: Hummingbird/Support/Theme.swift
      - path: Hummingbird/Support/Formatters.swift
      - path: Hummingbird/Models/Asset.swift
      - path: Hummingbird/Models/WatchlistItem.swift
      - path: Hummingbird/Services/SharedStorage.swift
      - path: Hummingbird/Views/Watchlist/Sparkline.swift
    settings:
      base:
        PRODUCT_NAME: HummingbirdWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.hummingbird.app.widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HummingbirdWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: HummingbirdWidget/HummingbirdWidget.entitlements
        SKIP_INSTALL: YES
  HummingbirdTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HummingbirdTests
    dependencies:
      - target: Hummingbird
    settings:
      base:
        PRODUCT_NAME: HummingbirdTests
        PRODUCT_BUNDLE_IDENTIFIER: com.hummingbird.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Hummingbird.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Hummingbird"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Hummingbird:
    build:
      targets:
        Hummingbird: all
        HummingbirdTests: [test]
    test:
      config: Debug
      targets:
        - HummingbirdTests
    run:
      config: Debug
      storeKitConfiguration: Products.storekit
