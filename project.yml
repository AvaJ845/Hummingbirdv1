name: Hummingbird
options:
  bundleIdPrefix: com.avaresearch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    MARKETING_VERSION: "1.9.0"
    CURRENT_PROJECT_VERSION: "13"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_PREVIEWS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ALWAYS_SEARCH_USER_PATHS: NO
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ENABLE_TESTABILITY: YES
      GCC_PREPROCESSOR_DEFINITIONS: "DEBUG=1 $(inherited)"
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      ENABLE_TESTABILITY: NO
targets:
  Hummingbird:
    type: application
    platform: iOS
    sources:
      - path: Hummingbird
        excludes:
          - "**/.DS_Store"
          - "**/*.storekit"
          - "**/*.entitlements"
          - "Info.plist"
          - "Resources/Legal/**"
      - path: Hummingbird/Resources/Legal
        buildPhase: resources
        type: folder
    dependencies:
      - target: HummingbirdWidget
        embed: true
    info:
      path: Hummingbird/Info.plist
      properties:
        CFBundleDisplayName: "$(APP_DISPLAY_NAME)"
        # Drive version/build from the shared build settings so the app and
        # the embedded widget always match. Without these, XcodeGen injects
        # its defaults (1.0 / 1) and the MARKETING_VERSION/CURRENT_PROJECT_VERSION
        # bumps never reach the app binary.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHumanReadableCopyright: "Educational projections — not financial advice."
        NSMicrophoneUsageDescription: "Hummingbird uses the microphone so you can dictate a stock ticker or crypto id for an educational projection."
        NSSpeechRecognitionUsageDescription: "Hummingbird converts speech into a ticker or coin id to run an educational price projection — not financial advice."
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.avaresearch.hummingbird.refresh
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
          CFBundleAlternateIcons:
            Midnight:
              CFBundleIconFiles:
                - AltIcon-Midnight
              UIPrerenderedIcon: false
            Mono:
              CFBundleIconFiles:
                - AltIcon-Mono
              UIPrerenderedIcon: false
    settings:
      base:
        PRODUCT_NAME: Hummingbird
        PRODUCT_BUNDLE_IDENTIFIER: com.avaresearch.hummingbird
        APP_DISPLAY_NAME: Hummingbird
        CODE_SIGN_ENTITLEMENTS: Hummingbird/Hummingbird.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # iPhone-only: Hummingbird is a portrait phone app. Universal (1,2)
        # would require all four iPad orientations for multitasking (upload
        # error 90474). iPad users can still run it in compatibility mode.
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          # Debug-only separate identity, so the dev build installs SIDE-BY-SIDE
          # with the TestFlight app instead of replacing it. Release is untouched.
          PRODUCT_BUNDLE_IDENTIFIER: com.avaresearch.hummingbird.dev
          APP_DISPLAY_NAME: Hummingbird Dev
    postBuildScripts:
      - name: Strip extended attributes (codesign detritus)
        script: /usr/bin/xattr -rc "${CODESIGNING_FOLDER_PATH}"
        basedOnDependencyAnalysis: false
  HummingbirdWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: HummingbirdWidget
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
      - path: Hummingbird/Support/AppGroup.swift
      - path: Hummingbird/Support/Theme.swift
      - path: Hummingbird/Support/Formatters.swift
      - path: Hummingbird/Models/Asset.swift
      - path: Hummingbird/Models/WatchlistItem.swift
      - path: Hummingbird/Models/SketchActivityAttributes.swift
      - path: Hummingbird/Services/SharedStorage.swift
      - path: Hummingbird/Views/Watchlist/Sparkline.swift
    settings:
      base:
        PRODUCT_NAME: HummingbirdWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.avaresearch.hummingbird.widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HummingbirdWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: HummingbirdWidget/HummingbirdWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
      configs:
        Debug:
          # Match the app's Debug identity so the embedded widget stays a valid
          # prefix (com.avaresearch.hummingbird.dev.widget).
          PRODUCT_BUNDLE_IDENTIFIER: com.avaresearch.hummingbird.dev.widget
    postBuildScripts:
      - name: Strip extended attributes (codesign detritus)
        script: /usr/bin/xattr -rc "${CODESIGNING_FOLDER_PATH}"
        basedOnDependencyAnalysis: false
  HummingbirdTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HummingbirdTests
    dependencies:
      - target: Hummingbird
    settings:
      base:
        PRODUCT_NAME: HummingbirdTests
        PRODUCT_BUNDLE_IDENTIFIER: com.avaresearch.hummingbird.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Hummingbird.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Hummingbird"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Hummingbird:
    build:
      targets:
        Hummingbird: all
        HummingbirdTests: [test]
    test:
      config: Debug
      targets:
        - HummingbirdTests
    run:
      config: Debug
      storeKitConfiguration: Products.storekit
