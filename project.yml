name: Hummingbird
options:
  bundleIdPrefix: com.avaresearch
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    # Explicit default so iOS targets keep resolving to iphoneos/iphonesimulator
    # now that watchOS targets exist in the same project — each watchOS target
    # overrides this with its own SDKROOT: watchos.
    SDKROOT: iphoneos
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_PREVIEWS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ALWAYS_SEARCH_USER_PATHS: NO
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ENABLE_TESTABILITY: YES
      GCC_PREPROCESSOR_DEFINITIONS: "DEBUG=1 $(inherited)"
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      ENABLE_TESTABILITY: NO
targets:
  Hummingbird:
    type: application
    platform: iOS
    sources:
      - path: Hummingbird
        excludes:
          - "**/.DS_Store"
          - "**/*.storekit"
          - "**/*.entitlements"
          - "Info.plist"
          - "Resources/Legal/**"
      - path: Hummingbird/Resources/Legal
        buildPhase: resources
        type: folder
    dependencies:
      - target: HummingbirdWidget
        embed: true
    info:
      path: Hummingbird/Info.plist
      properties:
        CFBundleDisplayName: "$(APP_DISPLAY_NAME)"
        # Drive version/build from the shared build settings so the app and
        # the embedded widget always match. Without these, XcodeGen injects
        # its defaults (1.0 / 1) and the MARKETING_VERSION/CURRENT_PROJECT_VERSION
        # bumps never reach the app binary.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # Portrait-only on both idioms. A universal app whose iPad build does
        # not advertise all four orientations is only accepted when it also
        # opts out of Split View / Slide Over via UIRequiresFullScreen — which
        # this app does (below). That combination is what clears App Store
        # upload error 90474.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        NSHumanReadableCopyright: "2026 AvaResearch LLC"
        # Mac Catalyst / visionOS "Designed for iPad" compatibility-mode
        # category — distinct from App Store Connect's own Primary Category
        # field (Finance, set separately in ASC's web UI), which is what
        # users actually see on the listing. Matches it for consistency.
        LSApplicationCategoryType: public.app-category.finance
        NSMicrophoneUsageDescription: "Hummingbird uses the microphone so you can dictate a stock ticker or crypto id for an educational projection."
        NSSpeechRecognitionUsageDescription: "Hummingbird converts speech into a ticker or coin id to run an educational price projection — not financial advice."
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.avaresearch.hummingbird.refresh
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
          CFBundleAlternateIcons:
            Midnight:
              CFBundleIconFiles:
                - AltIcon-Midnight
              UIPrerenderedIcon: false
            Mono:
              CFBundleIconFiles:
                - AltIcon-Mono
              UIPrerenderedIcon: false
        # iPad reads CFBundleIcons~ipad, not CFBundleIcons — mirror the phone
        # entry so the primary icon and both alternates (Midnight / Mono) work
        # on iPad too. The alt-icon rasters ship an ~ipad 152pt variant
        # (AppStore/icon/render.py) alongside the @2x/@3x phone sizes.
        CFBundleIcons~ipad:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
          CFBundleAlternateIcons:
            Midnight:
              CFBundleIconFiles:
                - AltIcon-Midnight
              UIPrerenderedIcon: false
            Mono:
              CFBundleIconFiles:
                - AltIcon-Mono
              UIPrerenderedIcon: false
    settings:
      base:
        PRODUCT_NAME: Hummingbird
        PRODUCT_BUNDLE_IDENTIFIER: com.avaresearch.hummingbird
        APP_DISPLAY_NAME: Hummingbird
        CODE_SIGN_ENTITLEMENTS: Hummingbird/Hummingbird.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Universal. Hummingbird stays a portrait-only, full-screen utility on
        # iPad (no Split View / Slide Over) — UIRequiresFullScreen: true in
        # info.properties is what lets a universal app ship without advertising
        # all four iPad orientations, clearing upload error 90474. The layout
        # is width-capped to a readable measure on regular size classes so it
        # reads as a considered iPad app, not a stretched phone screen.
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          # Debug-only separate identity, so the dev build installs SIDE-BY-SIDE
          # with the TestFlight app instead of replacing it. Release is untouched.
          PRODUCT_BUNDLE_IDENTIFIER: com.avaresearch.hummingbird.dev
          APP_DISPLAY_NAME: Hummingbird Dev
        Release:
          # Manual App Store signing, pinned to the installed distribution
          # profile — Automatic signing does not reliably pick up the Apple
          # Distribution cert for archive builds, so this is set explicitly
          # to survive every `xcodegen generate` without a GUI re-fix.
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: 3L683975L8
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Hummingbird App Store
    postBuildScripts:
      - name: Embed Watch Content (device/archive builds only)
        script: "\"$SRCROOT/Scripts/embed_watch_content.sh\""
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(CODESIGNING_FOLDER_PATH)/Watch/HummingbirdWatch.app"
      - name: Strip extended attributes (codesign detritus)
        script: /usr/bin/xattr -rc "${CODESIGNING_FOLDER_PATH}"
        basedOnDependencyAnalysis: false
  HummingbirdWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: HummingbirdWidget
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
      - path: Hummingbird/Support/AppGroup.swift
      - path: Hummingbird/Support/Theme.swift
      - path: Hummingbird/Support/Formatters.swift
      - path: Hummingbird/Models/Asset.swift
      - path: Hummingbird/Models/WatchlistItem.swift
      - path: Hummingbird/Models/SketchActivityAttributes.swift
      - path: Hummingbird/Models/TrackRecordSnapshot.swift
      - path: Hummingbird/Models/PortfolioSnapshot.swift
      - path: Hummingbird/Services/SharedStorage.swift
      - path: Hummingbird/Views/Watchlist/Sparkline.swift
    settings:
      base:
        PRODUCT_NAME: HummingbirdWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.avaresearch.hummingbird.widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HummingbirdWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: HummingbirdWidget/HummingbirdWidget.entitlements
        # Match the host app — widgets should be available on the iPad Home
        # Screen / Today view too.
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
      configs:
        Debug:
          # Match the app's Debug identity so the embedded widget stays a valid
          # prefix (com.avaresearch.hummingbird.dev.widget).
          PRODUCT_BUNDLE_IDENTIFIER: com.avaresearch.hummingbird.dev.widget
        Release:
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: 3L683975L8
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: hummingbird.widget
    postBuildScripts:
      - name: Strip extended attributes (codesign detritus)
        script: /usr/bin/xattr -rc "${CODESIGNING_FOLDER_PATH}"
        basedOnDependencyAnalysis: false
  HummingbirdWatch:
    type: application
    platform: watchOS
    sources:
      - path: HummingbirdWatch
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
      - path: Hummingbird/Support/AppGroup.swift
      - path: Hummingbird/Support/Formatters.swift
      - path: Hummingbird/Models/Asset.swift
      - path: Hummingbird/Models/WatchlistItem.swift
      - path: Hummingbird/Models/TrackRecordSnapshot.swift
      - path: Hummingbird/Models/PortfolioSnapshot.swift
      - path: Hummingbird/Services/SharedStorage.swift
    dependencies:
      - target: HummingbirdWatchWidget
        embed: true
    settings:
      base:
        PRODUCT_NAME: HummingbirdWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.avaresearch.hummingbird.watchkitapp
        WK_COMPANION_BUNDLE_ID: com.avaresearch.hummingbird
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HummingbirdWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: HummingbirdWatch/HummingbirdWatch.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Companion watch apps aren't independently installable products —
        # without this, the archive silently duplicates HummingbirdWatch.app
        # as a second top-level product alongside Hummingbird.app, which
        # breaks Xcode's archive metadata (ApplicationProperties) generation
        # and makes the whole archive unrecognizable as distributable.
        SKIP_INSTALL: YES
      configs:
        Debug:
          # Mirror the iOS Debug identity so the pairing (WKCompanionAppBundleIdentifier)
          # stays valid against the side-by-side dev install.
          PRODUCT_BUNDLE_IDENTIFIER: com.avaresearch.hummingbird.dev.watchkitapp
          WK_COMPANION_BUNDLE_ID: com.avaresearch.hummingbird.dev
        Release:
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: 3L683975L8
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: hummingbird.watchkitapp
    postBuildScripts:
      - name: Strip extended attributes (codesign detritus)
        script: /usr/bin/xattr -rc "${CODESIGNING_FOLDER_PATH}"
        basedOnDependencyAnalysis: false
  HummingbirdWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: HummingbirdWatchWidget
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
      - path: HummingbirdWatch/Shared/WatchTheme.swift
      - path: HummingbirdWatch/Shared/WatchSparkline.swift
      - path: HummingbirdWidget/SelectAssetIntent.swift
      - path: Hummingbird/Support/AppGroup.swift
      - path: Hummingbird/Support/Formatters.swift
      - path: Hummingbird/Models/Asset.swift
      - path: Hummingbird/Models/WatchlistItem.swift
      - path: Hummingbird/Models/TrackRecordSnapshot.swift
      - path: Hummingbird/Models/PortfolioSnapshot.swift
      - path: Hummingbird/Services/SharedStorage.swift
    settings:
      base:
        PRODUCT_NAME: HummingbirdWatchWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.avaresearch.hummingbird.watchkitapp.widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HummingbirdWatchWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: HummingbirdWatchWidget/HummingbirdWatchWidget.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
        SKIP_INSTALL: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.avaresearch.hummingbird.dev.watchkitapp.widget
        Release:
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: 3L683975L8
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: L8.com.avaresearch.hummingbird.watchkitapp.widget
    postBuildScripts:
      - name: Strip extended attributes (codesign detritus)
        script: /usr/bin/xattr -rc "${CODESIGNING_FOLDER_PATH}"
        basedOnDependencyAnalysis: false
  HummingbirdTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HummingbirdTests
      # Bundled so the opt-in `StoreKitEntitlementTests` (run with
      # RUN_STOREKIT_SESSION_TESTS=1) can spin up `SKTestSession(contentsOf:)`
      # from this same file. A plain `xcodebuild test` never constructs the
      # session (it corrupts storekitd on this Xcode/sim combo), so this
      # resource is inert in the default CI run.
      - path: Products.storekit
        buildPhase: resources
    dependencies:
      - target: Hummingbird
    settings:
      base:
        PRODUCT_NAME: HummingbirdTests
        PRODUCT_BUNDLE_IDENTIFIER: com.avaresearch.hummingbird.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Hummingbird.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Hummingbird"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # StoreKitTest.framework's own ObjC headers still reference the
        # iOS-18-deprecated `SKPaymentTransactionState`; importing the framework
        # in StoreKitEntitlementTests surfaces that as a Clang deprecation
        # warning we can't fix. Scope-suppress it for the test target only so the
        # build stays warning-clean without touching app code.
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -Wno-deprecated-declarations"
  HummingbirdUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HummingbirdUITests
    dependencies:
      - target: Hummingbird
    settings:
      base:
        PRODUCT_NAME: HummingbirdUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.avaresearch.hummingbird.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: Hummingbird
schemes:
  Hummingbird:
    build:
      targets:
        Hummingbird: all
        HummingbirdTests: [test]
        HummingbirdUITests: [test]
    test:
      config: Debug
      storeKitConfiguration: Products.storekit
      targets:
        - HummingbirdTests
        - HummingbirdUITests
    run:
      config: Debug
      storeKitConfiguration: Products.storekit
